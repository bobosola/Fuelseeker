<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find the cheapest UK fuel prices near you">
    <title>Fuelseeker.net</title>
    <link rel="stylesheet" href="/css/styles-20260206143452.css">
</head>
<body>
    <header>
        <nav>
            <span class="logo">⛽ Fuelseeker.net</span>
            <a href="/about.html" class="nav-link">About</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <h1>Find cheap UK fuel</h1>
        </div>
        <div class="search-container">
            <div class="search-box">
                <h2>Compare fuel prices</h2>
                <div class="button-group">
                    <button type="button" id="btnLocateMe" class="btn-secondary">📍 Use My Current Location</button>
                </div>
                <div class="separator tight">or</div>
                <div class="input-group">
                    <label for="postcode">Find by Postcode</label>
                    <input type="text" id="postcode" placeholder="e.g. SW1A 1AA" maxlength="8">
                </div>
                <div class="separator tight">or</div>
                <div class="input-group">
                    <label for="place">Find by Town or Street Name</label>
                    <input type="text" id="place" placeholder="e.g. Manchester or High Street">
                </div>
                <div class="button-group">
                    <button type="button" id="btnSearch" class="btn-primary">Find Fuel Stations</button>
                </div>
                <p class="last-updated" id="lastUpdated">Checking data status...</p>
                <div id="errorMessage" class="error-message hidden" role="alert"></div>
                <div id="loadingIndicator" class="loading hidden">
                    <span class="spinner"></span>
                    <span>Finding your location...</span>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="/js/index-20260206143452.js"></script>
</body>
</html>
